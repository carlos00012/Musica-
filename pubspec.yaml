name: musica
description: Reproductor ligero de música local para Android.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  flutter:
    sdk: flutter
  home_widget: ^0.10.0
  on_audio_query: ^2.9.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  just_audio: ^0.10.4

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
